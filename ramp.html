<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Rampen-Recorder</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 16px;
         background: #14151a; color: #eee; }
  h1 { font-size: 20px; color: #00d4ff; margin: 0 0 12px; }
  h2 { font-size: 13px; color: #9aa; margin: 14px 0 6px; text-transform: uppercase;
       letter-spacing: 0.5px; }
  label { display: block; font-size: 13px; color: #9aa; margin: 8px 0 4px; }
  input[type=number], input[type=text] {
    width: 100%; padding: 12px; font-size: 16px; border-radius: 8px;
    border: 1px solid #333; background: #1e2027; color: #eee;
  }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .checks { display: flex; gap: 10px; }
  .check { flex: 1; padding: 12px; border-radius: 8px; background: #1e2027;
           border: 1px solid #333; text-align: center; cursor: pointer;
           font-weight: 600; user-select: none; }
  .check.on { background: #003344; border-color: #00d4ff; color: #00d4ff; }
  button { padding: 14px; font-size: 16px; border: none; border-radius: 10px;
           cursor: pointer; font-weight: 600; }
  .full { width: 100%; margin-top: 12px; }
  #connectBtn { background: #00d4ff; color: #001; }
  #recordBtn  { background: #00ff88; color: #001; }
  #recordBtn.recording { background: #ff5566; color: #fff; }
  button:disabled { background: #333; color: #666; cursor: default; }

  .tabs { display: flex; gap: 6px; margin-bottom: 12px;
          border-bottom: 1px solid #333; }
  .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer;
         color: #9aa; font-weight: 600; border-bottom: 2px solid transparent;
         user-select: none; }
  .tab.active { color: #00d4ff; border-bottom-color: #00d4ff; }
  .panel { display: none; }
  .panel.active { display: block; }

  .stat { font-family: ui-monospace, Menlo, monospace; font-size: 14px;
          background: #0a0b0f; padding: 10px; border-radius: 8px; margin-top: 10px;
          font-variant-numeric: tabular-nums; }
  .live { display: flex; gap: 8px; font-size: 13px; color: #ddd; margin-top: 8px;
          font-variant-numeric: tabular-nums; }
  .live span { flex: 1; padding: 6px; background: #1e2027; border-radius: 6px;
               text-align: center; }
  .ok { color: #00ff88; } .err { color: #ff5566; }

  .card { background: #1e2027; border-radius: 10px; padding: 12px; margin-bottom: 10px;
          border: 1px solid #2a2d36; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline;
               margin-bottom: 6px; }
  .card-title { font-weight: 700; color: #eee; }
  .card-time  { font-size: 12px; color: #777; }
  .card-meta  { font-size: 13px; color: #9aa; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
  .card-btns  { display: flex; gap: 6px; }
  .btn-dl   { flex: 1; background: #003344; color: #00d4ff; }
  .btn-del  { background: #3d1a1a; color: #ff7788; }
  .empty   { color: #666; text-align: center; padding: 20px; }
</style>
</head>
<body>
<h1>Rampen-Recorder</h1>

<div class="tabs">
  <div class="tab active" data-tab="rec">Aufnahme</div>
  <div class="tab" data-tab="list">Versuche (<span id="count">0</span>)</div>
</div>

<!-- ---------- Aufnahme-Tab ---------- -->
<div class="panel active" id="panel-rec">
  <h2>Versuch</h2>
  <div class="row">
    <div><label>Rampenwinkel [°]</label>
         <input id="angle" type="number" step="0.1" min="0" max="90" value="30"></div>
    <div><label>Gewicht [g]</label>
         <input id="weight" type="number" step="0.1" min="0" value="50"></div>
  </div>

  <label>Material (Mehrfachauswahl)</label>
  <div class="checks">
    <div class="check" data-mat="echtholz">Echtholz</div>
    <div class="check" data-mat="furnier">Furnier</div>
  </div>

  <label>Notiz (optional)</label>
  <input id="note" type="text" placeholder="z.B. Rampe nass, Wachs">

  <h2>Gerät &amp; Aufnahme</h2>
  <button id="connectBtn" class="full">Mit NanoIMU verbinden</button>
  <button id="recordBtn" class="full" disabled>● Aufnahme starten</button>

  <div class="live">
    <span id="lx">X: —</span><span id="ly">Y: —</span><span id="lz">Z: —</span>
  </div>
  <div class="stat" id="stat">— bereit</div>
</div>

<!-- ---------- Versuche-Tab ---------- -->
<div class="panel" id="panel-list">
  <div id="cards"></div>
</div>

<script>
const SVC = "b0000000-1234-5678-1234-56789abcdef0";
const ACC = "b0000001-1234-5678-1234-56789abcdef0";
const STORAGE_KEY = "ramp_recordings_v1";

let device, ch;
let recording = false, samples = [], recStart = 0;
let live = { count: 0, t0: 0 };

const $ = id => document.getElementById(id);

// ===== Tabs =====
document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    $("panel-" + t.dataset.tab).classList.add("active");
    if (t.dataset.tab === "list") renderList();
  });
});

// ===== Material toggles =====
document.querySelectorAll(".check").forEach(el => {
  el.addEventListener("click", () => el.classList.toggle("on"));
});
function selectedMaterials() {
  return [...document.querySelectorAll(".check.on")].map(el => el.dataset.mat);
}
function meta() {
  const mats = selectedMaterials();
  return {
    angle_deg: parseFloat($("angle").value) || 0,
    weight_g:  parseFloat($("weight").value) || 0,
    mat_echtholz: mats.includes("echtholz") ? 1 : 0,
    mat_furnier:  mats.includes("furnier")  ? 1 : 0,
    note: $("note").value.trim().replace(/[\n,]/g, " "),
  };
}

// ===== Storage =====
function loadAll() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
  catch { return []; }
}
function saveAll(arr) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
  $("count").textContent = arr.length;
}
function saveRecording(rec) {
  const all = loadAll();
  all.unshift(rec);          // newest first
  saveAll(all);
}
function deleteRecording(id) {
  saveAll(loadAll().filter(r => r.id !== id));
  renderList();
}
$("count").textContent = loadAll().length;

// ===== BLE =====
function onAccel(ev) {
  const dv = ev.target.value;
  const x = dv.getFloat32(0, true), y = dv.getFloat32(4, true), z = dv.getFloat32(8, true);
  $("lx").textContent = "X: " + x.toFixed(3);
  $("ly").textContent = "Y: " + y.toFixed(3);
  $("lz").textContent = "Z: " + z.toFixed(3);

  if (recording) {
    samples.push({ t_ms: performance.now() - recStart, x, y, z });
  }

  live.count++;
  const dt = (performance.now() - live.t0) / 1000;
  if (dt > 1) {
    $("stat").innerHTML = `${recording ? '<span class="err">● REC</span> ' : 'live '}` +
                          `${(live.count / dt).toFixed(0)} Hz, ${samples.length} Samples`;
    live.count = 0; live.t0 = performance.now();
  }
}

async function connect() {
  try {
    $("stat").textContent = "Suche…";
    device = await navigator.bluetooth.requestDevice({
      filters: [{ name: "NanoIMU" }, { services: [SVC] }],
      optionalServices: [SVC],
    });
    device.addEventListener("gattserverdisconnected", () => {
      $("stat").innerHTML = '<span class="err">getrennt</span>';
      $("connectBtn").disabled = false;
      $("recordBtn").disabled = true;
    });
    $("stat").textContent = "Verbinde…";
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SVC);
    ch = await svc.getCharacteristic(ACC);
    await ch.startNotifications();
    ch.addEventListener("characteristicvaluechanged", onAccel);
    $("connectBtn").disabled = true;
    $("recordBtn").disabled = false;
    live.t0 = performance.now();
    $("stat").innerHTML = '<span class="ok">verbunden</span>';
  } catch (e) {
    $("stat").innerHTML = '<span class="err">Fehler: ' + e.message + '</span>';
  }
}

function toggleRecord() {
  if (!recording) {
    samples = [];
    recStart = performance.now();
    recording = true;
    $("recordBtn").textContent = "■ Stop";
    $("recordBtn").classList.add("recording");
  } else {
    recording = false;
    $("recordBtn").textContent = "● Aufnahme starten";
    $("recordBtn").classList.remove("recording");
    const dur = (performance.now() - recStart) / 1000;
    if (samples.length > 0) {
      const m = meta();
      const rec = {
        id: Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7),
        recorded_at: new Date().toISOString(),
        duration_s: +dur.toFixed(2),
        ...m,
        // parallel arrays = compacter JSON than array of objects
        t:  samples.map(s => +s.t_ms.toFixed(1)),
        x:  samples.map(s => +s.x.toFixed(5)),
        y:  samples.map(s => +s.y.toFixed(5)),
        z:  samples.map(s => +s.z.toFixed(5)),
      };
      try {
        saveRecording(rec);
        $("stat").innerHTML = `<span class="ok">${samples.length} Samples in ${dur.toFixed(1)}s gespeichert → Tab „Versuche"</span>`;
      } catch (e) {
        $("stat").innerHTML = `<span class="err">Speichern fehlgeschlagen: ${e.message} (localStorage voll?)</span>`;
      }
    } else {
      $("stat").innerHTML = '<span class="err">Keine Samples</span>';
    }
  }
}

// ===== Liste =====
function recToCsv(rec) {
  const head = "t_ms,x_g,y_g,z_g,angle_deg,weight_g,mat_echtholz,mat_furnier,note\n";
  const rows = [];
  for (let i = 0; i < rec.t.length; i++) {
    rows.push([rec.t[i], rec.x[i], rec.y[i], rec.z[i],
               rec.angle_deg, rec.weight_g,
               rec.mat_echtholz, rec.mat_furnier, rec.note || ""].join(","));
  }
  return head + rows.join("\n");
}
function downloadRec(rec) {
  const csv = recToCsv(rec);
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const ts = rec.recorded_at.replace(/[:.]/g, "-").slice(0, 19);
  const mats = ["echtholz","furnier"].filter(m => rec["mat_" + m]).join("+") || "none";
  a.href = url;
  a.download = `ramp_${rec.angle_deg}deg_${rec.weight_g}g_${mats}_${ts}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}
function magStats(rec) {
  let mn = Infinity, mx = -Infinity;
  for (let i = 0; i < rec.t.length; i++) {
    const m = Math.sqrt(rec.x[i]*rec.x[i] + rec.y[i]*rec.y[i] + rec.z[i]*rec.z[i]);
    if (m < mn) mn = m; if (m > mx) mx = m;
  }
  return { mn, mx };
}
function renderList() {
  const all = loadAll();
  const box = $("cards");
  if (all.length === 0) {
    box.innerHTML = '<div class="empty">Noch keine Versuche aufgenommen.</div>';
    return;
  }
  box.innerHTML = all.map(rec => {
    const mats = ["echtholz","furnier"].filter(m => rec["mat_" + m]).join(" + ") || "kein Material";
    const t = new Date(rec.recorded_at);
    const tt = t.toLocaleString();
    const s = magStats(rec);
    const note = rec.note ? `<div style="font-size:12px;color:#aaa">📝 ${rec.note}</div>` : "";
    return `
      <div class="card">
        <div class="card-head">
          <div class="card-title">${rec.angle_deg}° / ${rec.weight_g} g / ${mats}</div>
          <div class="card-time">${tt}</div>
        </div>
        <div class="card-meta">
          ${rec.t.length} Samples · ${rec.duration_s}s · |a| ${s.mn.toFixed(2)}–${s.mx.toFixed(2)} g
        </div>
        ${note}
        <div class="card-btns">
          <button class="btn-dl"  data-id="${rec.id}" data-act="dl">⬇ CSV</button>
          <button class="btn-del" data-id="${rec.id}" data-act="del">🗑 Löschen</button>
        </div>
      </div>`;
  }).join("");

  box.querySelectorAll("button[data-act]").forEach(b => {
    b.addEventListener("click", () => {
      const rec = loadAll().find(r => r.id === b.dataset.id);
      if (!rec) return;
      if (b.dataset.act === "dl") downloadRec(rec);
      else if (b.dataset.act === "del" && confirm("Diesen Versuch löschen?")) {
        deleteRecording(rec.id);
      }
    });
  });
}

$("connectBtn").addEventListener("click", connect);
$("recordBtn").addEventListener("click", toggleRecord);
</script>
</body>
</html>
